services:
  - type: web
    name: transcription-call-server
    runtime: node
    buildCommand: npm install && python -m pip install openai-whisper
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_LANGUAGE
        value: en
