<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Real-Time Call Transcription</title>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #e2e8f0;
        margin: 0;
        padding: 10px;
        max-width: 1180px;
        margin: 0 auto;
      }

      .container {
        display: grid;
        grid-template-columns: 285px minmax(0, 1fr);
        gap: 12px;
        margin-bottom: 16px;
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }

        .transcript-panel {
          grid-column: 1;
          grid-row: 1;
        }

        .controls-panel {
          grid-column: 1;
          grid-row: 2;
        }
      }

      .panel {
        background: #1e293b;
        border-radius: 8px;
        padding: 12px;
        border: 1px solid #334155;
      }

      h1 {
        color: #38bdf8;
        margin: 0;
        font-size: 1.3rem;
      }

      h2 {
        color: #38bdf8;
        font-size: 0.95rem;
        margin: 8px 0 6px 0;
      }

      .setup-section {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 0.85rem;
        color: #94a3b8;
        margin-bottom: 4px;
        font-weight: 500;
      }

      input,
      textarea {
        width: 100%;
        padding: 7px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        font-size: 0.85rem;
        font-family: "Courier New", monospace;
        margin-bottom: 8px;
      }

      button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        width: 100%;
        transition: background 0.2s;
      }

      button:hover {
        background: #2563eb;
      }

      button:disabled {
        background: #475569;
        cursor: not-allowed;
      }

      .button-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 0.8rem;
        font-weight: 500;
        margin-bottom: 12px;
      }

      .status-badge.connected {
        background: #10b981;
        color: white;
      }

      .status-badge.disconnected {
        background: #ef4444;
        color: white;
      }

      .status-badge.listening {
        background: #f59e0b;
        color: white;
      }

      .transcription-box {
        background: #0f172a;
        border-radius: 8px;
        padding: 18px 22px;
        height: calc(100vh - 155px);
        min-height: 480px;
        overflow-y: auto;
        border: 1px solid #334155;
        margin-bottom: 12px;
        font-size: clamp(1.1rem, 2vw, 1.45rem);
        line-height: 1.65;
        scroll-behavior: smooth;
        box-shadow: inset 0 18px 28px rgba(15, 23, 42, 0.35);
      }

      .transcript-entry {
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid #334155;
      }

      .transcript-entry:last-child {
        border-bottom: none;
      }

      .speaker-name {
        color: #38bdf8;
        font-weight: 500;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .transcript-text {
        color: #e2e8f0;
      }

      .transcript-partial {
        color: #94a3b8;
        font-style: italic;
      }

      .info-box {
        background: #1e293b;
        border-left: 4px solid #38bdf8;
        padding: 12px;
        border-radius: 4px;
        font-size: 0.85rem;
        color: #cbd5e1;
        margin-bottom: 12px;
      }

      .error-box {
        background: #7f1d1d;
        border-left: 4px solid #ef4444;
        padding: 12px;
        border-radius: 4px;
        font-size: 0.85rem;
        color: #fecaca;
        margin-bottom: 12px;
      }

      .icon {
        display: inline-block;
        margin-right: 6px;
      }

      .signal-indicator {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 0.8rem;
      }

      .signal-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        animation: pulse 1s infinite;
      }

      .signal-dot.active {
        background: #10b981;
      }

      .signal-dot.inactive {
        background: #64748b;
        animation: none;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .volume-indicator {
        width: 100%;
        height: 4px;
        background: #0f172a;
        border-radius: 2px;
        overflow: hidden;
        margin-top: 4px;
      }

      .volume-bar {
        height: 100%;
        background: linear-gradient(90deg, #10b981, #3b82f6);
        width: 0%;
        transition: width 0.1s;
      }

      .footer {
        text-align: center;
        color: #64748b;
        font-size: 0.8rem;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid #334155;
      }

      .utility-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 8px 0;
      }

      .usage-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin: 8px 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .usage-item {
        background: #0f172a;
        border-radius: 5px;
        padding: 7px;
        font-size: 0.7rem;
        color: #94a3b8;
      }

      .usage-item strong {
        display: block;
        color: #e2e8f0;
        font-size: 0.75rem;
        margin-bottom: 3px;
      }

      .code-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .code-input {
        font-size: 1.15rem;
        letter-spacing: 0.18em;
        text-align: center;
        font-weight: 700;
      }

      .transcript-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .transcript-header h2 {
        font-size: 1.05rem;
        margin: 0 0 8px;
      }

      .setup-step {
        background: #0f172a;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 8px;
        border-left: 3px solid #38bdf8;
      }

      .step-number {
        color: #38bdf8;
        font-weight: bold;
        margin-right: 8px;
      }
    </style>
  </head>

  <body>
    <div style="margin-bottom: 10px">
      <h1>🎙️ Real-Time Call Transcription</h1>
    </div>

    <div class="container">
      <div class="panel controls-panel">
        <h2>Call Controls</h2>

        <label>Your name</label>
        <input type="text" id="userName" placeholder="Your name" value="You" />

        <div class="code-label">
          <label>Generated call ID</label>
          <span style="font-size: 0.7rem; color: #64748b">Share this</span>
        </div>
        <input
          class="code-input"
          type="text"
          id="peerId"
          readonly
          placeholder="------" />

          <label>Connection ID to join</label>
        <input
          class="code-input"
          type="text"
          id="remotePeerId"
          inputmode="numeric"
          maxlength="6"
          placeholder="123456" />

        <div class="utility-row">
          <button onclick="generateNewPeerId()">New ID</button>
          <button onclick="connectToPeer()">Connect</button>
        </div>

        <div id="connectionStatus" class="status-badge disconnected">
          <span class="icon">●</span> Disconnected
        </div>

        <div class="usage-strip" aria-label="Transcription usage">
          <div class="usage-item"><strong>Live</strong>Browser STT</div>
          <div class="usage-item"><strong>Unlimited</strong>Local Whisper</div>
          <div class="usage-item">
            <strong id="activeEngine">Ready</strong>Active engine
          </div>
        </div>

        <div style="margin-top: 8px">
          <div class="volume-indicator">
            <div id="localVolume" class="volume-bar"></div>
          </div>
          <div
            id="micStatus"
            style="font-size: 0.75rem; color: #94a3b8; margin-top: 4px">
            Connect to allow microphone
          </div>
        </div>

        <button
          onclick="endCall()"
          style="background: #ef4444; margin-top: 8px">
          End Call
        </button>

        <div style="margin-top: 8px">
          <div id="transcriptionStatus" class="status-badge disconnected">
            <span class="icon">●</span> Not Connected
          </div>
        </div>
      </div>

      <div class="panel transcript-panel">
        <div class="transcript-header">
          <h2>Live Transcription</h2>
          <span class="signal-indicator"
            ><span class="signal-dot inactive"></span> Live</span
          >
        </div>
        <div class="transcription-box" id="transcriptionDisplay">
          <div style="color: #64748b; text-align: center; padding-top: 120px">
            Your conversation will appear here
          </div>
        </div>

        <label style="margin-top: 8px">🔊 Remote Volume</label>
        <div class="volume-indicator">
          <div id="remoteVolume" class="volume-bar"></div>
        </div>

        <div id="errorDisplay" style="margin-top: 12px"></div>
      </div>
    </div>

    <div class="footer">
      <p>Audio call and live transcript</p>
    </div>

    <script>
      // Global state
      const state = {
        peerId: null,
        localStream: null,
        peer: null,
        remotePeerConnection: null,
        socket: null,
        sessionId: null,
        isHost: false,
        recognition: null,
        whisperRecorder: null,
        whisperFallback: false,
        userName: "You",
        remoteUserName: "Remote",
        transcripts: [],
        mediaRecorder: null,
        audioContext: null,
        analyser: null,
        localAnalyser: null,
        isConnected: false,
        isMicEnabled: false,
      };

      // Generate unique peer ID
      function generatePeerId() {
        return String(Math.floor(100000 + Math.random() * 900000));
      }

      const signalingServer =
        new URLSearchParams(window.location.search).get("server") ||
        window.TRANSCRIPTION_SIGNALING_SERVER ||
        (window.location.hostname === "localhost"
          ? "http://localhost:3000"
          : "https://transcription-call-server.onrender.com");

      function connectToSignalingServer() {
        if (state.socket) return state.socket;

        state.socket = io(signalingServer, { transports: ["websocket", "polling"] });
        state.socket.on("connect_error", () => {
          showError(
            "Call server unavailable. Deploy code-call-server.js and open this page with ?server=https://your-server-url.",
          );
        });
        state.socket.on("guest-joined", async ({ sessionId }) => {
          if (state.isHost && sessionId === state.sessionId) {
            await createOffer();
          }
        });
        state.socket.on("webrtc-offer-received", async ({ fromId, offer }) => {
          if (fromId === state.socket.id) return;
          await handleOffer(offer);
        });
        state.socket.on("webrtc-answer-received", async ({ fromId, answer }) => {
          if (fromId === state.socket.id || !state.remotePeerConnection) return;
          await state.remotePeerConnection.setRemoteDescription(answer);
          updateConnectionStatus(true);
        });
        state.socket.on("webrtc-ice-candidate", async ({ fromId, candidate }) => {
          if (fromId === state.socket.id || !state.remotePeerConnection || !candidate) return;
          try {
            await state.remotePeerConnection.addIceCandidate(candidate);
          } catch (error) {
            console.debug("ICE candidate was not accepted:", error.message);
          }
        });
        state.socket.on("transcript-updated", ({ senderId, speaker, text }) => {
          if (senderId !== state.socket.id) {
            updateTranscript(speaker, text);
          }
        });
        state.socket.on("peer-disconnected", () => {
          state.isConnected = false;
          updateConnectionStatus(false);
          showInfo("The other person left the call.");
        });
        return state.socket;
      }

      function waitForSignalingConnection() {
        const socket = connectToSignalingServer();
        if (socket.connected) return Promise.resolve(socket);

        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            socket.off("connect", onConnect);
            reject(new Error("The call server did not respond in time."));
          }, 15000);
          const onConnect = () => {
            clearTimeout(timeout);
            resolve(socket);
          };
          socket.once("connect", onConnect);
        });
      }

      // Initialize on page load
      window.addEventListener("load", function () {
        state.peerId = "------";
        document.getElementById("peerId").value = state.peerId;
        connectToSignalingServer();
      });

      async function generateNewPeerId() {
        state.userName = document.getElementById("userName").value.trim() || "You";
        try {
          const socket = await waitForSignalingConnection();
          socket.emit("host-generate-code", {}, (result) => {
            if (!result?.success) {
              showError(result?.error || "Could not create a call ID");
              return;
            }
            state.isHost = true;
            state.sessionId = result.sessionId;
            state.peerId = result.code;
            document.getElementById("peerId").value = result.code;
            startBrowserTranscription();
            updateConnectionStatus(false);
            showInfo("Call ID created. Share it with the other person.");
          });
        } catch (error) {
          showError(error.message);
        }
        if (!state.localStream) {
          await toggleMicrophone();
        }
      }

      // Toggle microphone
      async function toggleMicrophone() {
        if (state.isMicEnabled) {
          disableMicrophone();
          return true;
        }

        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false,
          });
          state.localStream = stream;
          state.isMicEnabled = true;

          // Setup audio analysis
          state.audioContext = new (
            window.AudioContext || window.webkitAudioContext
          )();
          state.localAnalyser = state.audioContext.createAnalyser();
          const source = state.audioContext.createMediaStreamSource(stream);
          source.connect(state.localAnalyser);

          // Start monitoring volume
          monitorVolume(state.localAnalyser, "localVolume");

          document.getElementById("micStatus").textContent =
            "🟢 Microphone enabled";

          // Add the microphone if the connection was created first.
          if (state.remotePeerConnection) {
            state.remotePeerConnection.addTrack(stream.getAudioTracks()[0], stream);
          }

          return true;
        } catch (error) {
          showError("Microphone access denied: " + error.message);
          return false;
        }
      }

      function disableMicrophone() {
        if (state.localStream) {
          state.localStream.getTracks().forEach((track) => track.stop());
          state.localStream = null;
        }

        state.isMicEnabled = false;
        if (state.whisperRecorder && state.whisperRecorder.state !== "inactive") {
          state.whisperRecorder.stop();
        }
        state.whisperRecorder = null;
        document.getElementById("micStatus").textContent =
          "🔴 Microphone disabled";
      }

      function startBrowserTranscription() {
        const SpeechRecognition =
          window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          startWhisperFallback();
          return;
        }

        if (state.recognition) {
          return;
        }

        state.recognition = new SpeechRecognition();
        state.recognition.continuous = true;
        state.recognition.interimResults = true;
        state.recognition.lang = "en-IN";
        state.recognition.onresult = (event) => {
          for (let index = event.resultIndex; index < event.results.length; index++) {
            const text = event.results[index][0].transcript.trim();
            if (text) {
              const isPartial = !event.results[index].isFinal;
              updateTranscript(state.userName, text, isPartial);
              if (!isPartial && state.socket && state.sessionId) {
                state.socket.emit("add-transcript", {
                  sessionId: state.sessionId,
                  speaker: state.userName,
                  text,
                });
              }
            }
          }
        };
        state.recognition.onend = () => {
          if (state.isMicEnabled && state.recognition) {
            try {
              state.recognition.start();
            } catch (error) {
              console.debug("Speech recognition restart:", error.message);
            }
          }
        };
        state.recognition.onerror = (event) => {
          if (event.error !== "no-speech") {
            state.recognition.onend = null;
            state.recognition = null;
            startWhisperFallback();
          }
        };
        state.recognition.start();
        document.getElementById("activeEngine").textContent = "Browser STT";
        updateTranscriptionStatus(true);
      }

      function startWhisperFallback() {
        if (!state.localStream || state.whisperRecorder) return;
        if (!window.MediaRecorder) {
          showError("This browser cannot record audio for local Whisper fallback.");
          return;
        }
        state.whisperFallback = true;
        document.getElementById("activeEngine").textContent = "Local Whisper";
        const recorder = new MediaRecorder(state.localStream, {
          mimeType: MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
            ? "audio/webm;codecs=opus"
            : "audio/webm",
        });
        state.whisperRecorder = recorder;
        recorder.ondataavailable = async (event) => {
          if (!event.data.size || !state.sessionId) return;
          try {
            const response = await fetch(`${signalingServer}/api/whisper`, {
              method: "POST",
              headers: { "Content-Type": event.data.type || "audio/webm" },
              body: event.data,
            });
            const result = await response.json();
            if (result.text) {
              updateTranscript(state.userName, result.text);
              state.socket.emit("add-transcript", {
                sessionId: state.sessionId,
                speaker: state.userName,
                text: result.text,
              });
            }
          } catch (error) {
            showError("Local Whisper is unavailable on the call server.");
          }
        };
        recorder.start(5000);
        document.getElementById("micStatus").textContent =
          "🟢 Local Whisper fallback active";
      }

      function createPeerConnection() {
        if (state.remotePeerConnection) return state.remotePeerConnection;

        const peerConnection = new RTCPeerConnection({
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" },
          ],
        });

        state.localStream.getTracks().forEach((track) => {
          peerConnection.addTrack(track, state.localStream);
        });
        peerConnection.ontrack = (event) => {
          const remoteStream = event.streams[0];
          const audio = document.createElement("audio");
          audio.autoplay = true;
          audio.playsInline = true;
          audio.srcObject = remoteStream;
          document.body.appendChild(audio);
          if (state.audioContext) {
            state.analyser = state.audioContext.createAnalyser();
            state.audioContext.createMediaStreamSource(remoteStream).connect(state.analyser);
            monitorVolume(state.analyser, "remoteVolume");
          }
        };
        peerConnection.onicecandidate = (event) => {
          if (event.candidate && state.socket && state.sessionId) {
            state.socket.emit("webrtc-ice-candidate", {
              sessionId: state.sessionId,
              candidate: event.candidate,
            });
          }
        };
        peerConnection.onconnectionstatechange = () => {
          const connected = peerConnection.connectionState === "connected";
          state.isConnected = connected;
          updateConnectionStatus(connected);
          if (peerConnection.connectionState === "failed") {
            showError("Connection failed. Both devices must stay online during setup.");
          }
        };
        state.remotePeerConnection = peerConnection;
        return peerConnection;
      }

      async function createOffer() {
        const peerConnection = createPeerConnection();
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        state.socket.emit("webrtc-offer", {
          sessionId: state.sessionId,
          offer: peerConnection.localDescription,
        });
        showInfo("Connecting to the other person...");
      }

      async function handleOffer(offer) {
        const peerConnection = createPeerConnection();
        await peerConnection.setRemoteDescription(offer);
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        state.socket.emit("webrtc-answer", {
          sessionId: state.sessionId,
          answer: peerConnection.localDescription,
        });
        showInfo("Answer sent. Connecting...");
      }

      // Connect to a six-digit call
      async function connectToPeer() {
        const remotePeerId = document
          .getElementById("remotePeerId")
          .value.trim();
        if (!remotePeerId) {
          showError("Please enter the six-digit connection ID");
          return;
        }

        if (!/^\d{6}$/.test(remotePeerId)) {
          showError("Connection ID must be six digits");
          return;
        }

        state.userName =
          document.getElementById("userName").value.trim() || "You";

        if (!state.localStream && !(await toggleMicrophone())) {
          return;
        }

        const socket = await waitForSignalingConnection();
        socket.emit("guest-join-code", { code: remotePeerId }, async (result) => {
          if (!result?.success) {
            showError(result?.error || "Could not join this call ID");
            return;
          }
          state.isHost = false;
          state.sessionId = result.sessionId;
          startBrowserTranscription();
          createPeerConnection();
          updateConnectionStatus(false);
          showInfo("Joined call. Waiting for the host to connect...");
        });
      }

      // Update transcript display
      function updateTranscript(speaker, text, isPartial = false) {
        // Remove previous partial
        const existing = state.transcripts.find(
          (t) => t.speaker === speaker && t.isPartial,
        );
        if (existing) {
          if (!isPartial) {
            existing.isPartial = false;
            existing.text = text;
          }
        } else if (text.trim()) {
          state.transcripts.push({ speaker, text, isPartial });
        }

        renderTranscripts();
      }

      function renderTranscripts() {
        const display = document.getElementById("transcriptionDisplay");
        display.innerHTML = state.transcripts
          .map(
            (entry) =>
              `<div class="transcript-entry">
            <div class="speaker-name">👤 ${entry.speaker}</div>
            <div class="transcript-text ${entry.isPartial ? "transcript-partial" : ""}">
              ${entry.text}
            </div>
          </div>`,
          )
          .join("");
        display.scrollTop = display.scrollHeight;
      }

      // Monitor audio volume
      function monitorVolume(analyser, elementId) {
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        function update() {
          analyser.getByteFrequencyData(dataArray);
          const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
          const percentage = Math.min(100, (average / 255) * 150);
          document.getElementById(elementId).style.width = percentage + "%";

          requestAnimationFrame(update);
        }

        update();
      }

      // Update UI status
      function updateTranscriptionStatus(connected) {
        const badge = document.getElementById("transcriptionStatus");
        if (connected) {
          badge.innerHTML = '<span class="icon">●</span> Transcription Ready';
          badge.className = "status-badge listening";
        } else {
          badge.innerHTML = '<span class="icon">●</span> Not Connected';
          badge.className = "status-badge disconnected";
        }
      }

      function updateConnectionStatus(connected) {
        const badge = document.getElementById("connectionStatus");
        if (connected) {
          badge.innerHTML = '<span class="icon">●</span> Connected to Peer';
          badge.className = "status-badge connected";
        } else {
          badge.innerHTML = '<span class="icon">●</span> Disconnected';
          badge.className = "status-badge disconnected";
        }
      }

      function showError(message) {
        const errorDiv = document.getElementById("errorDisplay");
        errorDiv.innerHTML = `<div class="error-box">⚠️ ${message}</div>`;
        setTimeout(() => {
          errorDiv.innerHTML = "";
        }, 5000);
      }

      function showInfo(message) {
        const errorDiv = document.getElementById("errorDisplay");
        errorDiv.innerHTML = `<div class="info-box">ℹ️ ${message}</div>`;
        setTimeout(() => {
          errorDiv.innerHTML = "";
        }, 6000);
      }

      // End call
      function endCall() {
        if (state.recognition) {
          state.recognition.onend = null;
          state.recognition.stop();
          state.recognition = null;
        }
        if (state.localStream) {
          state.localStream.getTracks().forEach((track) => track.stop());
        }

        if (state.remotePeerConnection) {
          state.remotePeerConnection.close();
        }

        if (state.socket && state.sessionId) {
          state.socket.emit("end-call", { sessionId: state.sessionId });
        }

        disableMicrophone();
        state.remotePeerConnection = null;
        state.sessionId = null;
        state.isHost = false;
        state.isConnected = false;
        updateConnectionStatus(false);
        state.transcripts = [];
        document.getElementById("transcriptionDisplay").innerHTML =
          '<div style="color: #64748b; text-align: center; padding-top: 120px;">Call ended. Transcriptions cleared.</div>';
      }
    </script>
  </body>
</html>
